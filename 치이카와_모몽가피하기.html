<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff4f7">
<title>치이카와 모몽가 피하기</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#fff7f9; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  body { display:flex; align-items:center; justify-content:center; padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom); }
  #app { width:min(100vw,520px); height:100%; max-height:920px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .topbar { width:100%; display:flex; justify-content:space-between; align-items:center; padding:8px 8px 0; font-weight:800; color:#4b3a40; }
  #score { font-size:22px; }
  #best { font-size:14px; opacity:.65; }
  #stageWrap { position:relative; width:100%; flex:1; min-height:430px; max-height:720px; border-radius:28px; overflow:hidden; background:linear-gradient(#fffafd,#fff1f6); box-shadow:0 10px 30px rgba(166,80,111,.12), inset 0 0 0 2px rgba(255,167,193,.28); touch-action:none; }
  #ribbonArt { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); width:82%; max-width:390px; opacity:.17; pointer-events:none; filter:saturate(.85); }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:28px; text-align:center; background:rgba(255,247,250,.76); backdrop-filter:blur(2px); z-index:5; }
  .overlay.hidden { display:none; }
  h1 { margin:0; color:#513a43; font-size:30px; letter-spacing:-1px; }
  .desc { color:#735a63; line-height:1.55; font-size:15px; }
  button { border:0; border-radius:999px; font-weight:800; cursor:pointer; }
  .start { padding:15px 36px; font-size:20px; color:white; background:linear-gradient(135deg,#ff9fbc,#ff7fa6); box-shadow:0 7px 0 #e7668e; }
  .start:active { transform:translateY(4px); box-shadow:0 3px 0 #e7668e; }
  #controls { display:flex; gap:16px; width:100%; padding:0 4px 8px; }
  .ctrl { flex:1; height:64px; font-size:31px; color:#ff709c; background:white; border:2px solid #ffc0d3; box-shadow:0 5px 12px rgba(197,80,118,.10); touch-action:none; }
  .ctrl:active,.ctrl.active { background:#ffe9f0; transform:scale(.98); }
  .tip { color:#957781; font-size:12px; text-align:center; padding-bottom:4px; }
</style>
</head>

  };
  for (const [k,src] of Object.entries(sources)) {
    imgs[k] = new Image();
    imgs[k].src = src;
  }

  let W=0,H=0,dpr=1;
  let running=false, last=0, spawnTimer=0, itemTimer=0, score=0;
  let leftHeld=false, rightHeld=false;
  let objects=[];
  let best = Number(localStorage.getItem('chiikawaBest') || 0);
  bestEl.textContent = '최고 ' + best;

  const player = { x:0,y:0,w:68,h:78,speed:360 };

  function resize() {
    const r = wrap.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W*dpr);
    canvas.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    player.w = Math.max(58, Math.min(76, W*0.17));
    player.h = player.w*1.08;
    player.y = H-player.h-18;
    player.x = Math.max(0, Math.min(player.x || (W-player.w)/2, W-player.w));
    draw();
  }
  window.addEventListener('resize', resize);
  new ResizeObserver(resize).observe(wrap);

  function reset() {
    score=0; objects=[]; spawnTimer=0; itemTimer=0;
    player.x=(W-player.w)/2;
    updateScore();
  }
  function updateScore() {
    scoreEl.textContent='점수 '+score;
  }
  function spawnEnemy() {
    const size = Math.max(54, Math.min(78, W*(0.14 + Math.random()*0.035)));
    objects.push({
      type:'enemy', x:Math.random()*(W-size), y:-size-10,
      w:size, h:size, vy:170 + Math.random()*85 + Math.min(score*3,90),
      rot:(Math.random()-.5)*.18
    });
  }
  function spawnItem() {
    const size = Math.max(44, Math.min(61, W*.12));
    objects.push({
      type:'item', x:Math.random()*(W-size), y:-size-10,
      w:size, h:size*.85, vy:145 + Math.random()*45,
      rot:(Math.random()-.5)*.1
    });
  }
  function hit(a,b,pad=0.18) {
    return a.x+a.w*(1-pad) > b.x+b.w*pad &&
           a.x+a.w*pad < b.x+b.w*(1-pad) &&
           a.y+a.h*(1-pad) > b.y+b.h*pad &&
           a.y+a.h*pad < b.y+b.h*(1-pad);
  }

  function update(dt) {
    if (leftHeld) player.x -= player.speed*dt;
    if (rightHeld) player.x += player.speed*dt;
    player.x = Math.max(0, Math.min(W-player.w, player.x));

    spawnTimer += dt;
    itemTimer += dt;
    const enemyInterval = Math.max(.43, .86 - score*.012);
    if (spawnTimer > enemyInterval) { spawnTimer=0; spawnEnemy(); }
    if (itemTimer > 1.45 + Math.random()*.55) { itemTimer=0; spawnItem(); }

    for (const o of objects) o.y += o.vy*dt;

    for (let i=objects.length-1;i>=0;i--) {
      const o=objects[i];
      if (hit(player,o, o.type==='enemy' ? .25 : .17)) {
        if (o.type==='enemy') return endGame();
        score++;
        updateScore();
        objects.splice(i,1);
        if (navigator.vibrate) navigator.vibrate(25);
      } else if (o.y > H+20) {
        objects.splice(i,1);
      }
    }
  }

  function roundedRect(x,y,w,h,r) {
    ctx.beginPath();
    ctx.roundRect(x,y,w,h,r);
  }

  function drawImageFit(img,x,y,w,h,rot=0) {
    if (!img.complete) return;
    ctx.save();
    ctx.translate(x+w/2,y+h/2);
    ctx.rotate(rot);
    ctx.drawImage(img,-w/2,-h/2,w,h);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0,0,W,H);

    // soft central lane
    ctx.save();
    ctx.globalAlpha=.25;
    ctx.fillStyle='#fff';
    roundedRect(W*.08,14,W*.84,H-28,24);
    ctx.fill();
    ctx.restore();

    for (const o of objects) {
      drawImageFit(imgs[o.type],o.x,o.y,o.w,o.h,o.rot);
    }
    drawImageFit(imgs.player,player.x,player.y,player.w,player.h,0);
  }

  function loop(t) {
    if (!running) return;
    const dt=Math.min((t-last)/1000,.035); last=t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    reset();
    startOverlay.classList.add('hidden');
    gameOver.classList.add('hidden');
    running=true; last=performance.now();
    requestAnimationFrame(loop);
  }

  function endGame() {
    running=false;
    if (navigator.vibrate) navigator.vibrate([80,45,120]);
    if (score>best) {
      best=score;
      localStorage.setItem('chiikawaBest',best);
      bestEl.textContent='최고 '+best;
    }
    finalScore.textContent='점수 '+score+'점';
    gameOver.classList.remove('hidden');
  }

  function bindHold(el, dir) {
    const on=e=>{e.preventDefault(); if(dir<0) leftHeld=true; else rightHeld=true; el.classList.add('active');};
    const off=e=>{e.preventDefault(); if(dir<0) leftHeld=false; else rightHeld=false; el.classList.remove('active');};
    el.addEventListener('pointerdown',on);
    el.addEventListener('pointerup',off);
    el.addEventListener('pointercancel',off);
    el.addEventListener('pointerleave',off);
  }
  bindHold(document.getElementById('left'),-1);
  bindHold(document.getElementById('right'),1);

  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft') leftHeld=true;
    if(e.key==='ArrowRight') rightHeld=true;
  });
  window.addEventListener('keyup',e=>{
    if(e.key==='ArrowLeft') leftHeld=false;
    if(e.key==='ArrowRight') rightHeld=false;
  });

  let dragging=false;
  wrap.addEventListener('pointerdown',e=>{
    if (!running) return;
    dragging=true;
    wrap.setPointerCapture?.(e.pointerId);
    moveTo(e);
  });
  wrap.addEventListener('pointermove',e=>{ if(dragging && running) moveTo(e); });
  wrap.addEventListener('pointerup',()=>dragging=false);
  wrap.addEventListener('pointercancel',()=>dragging=false);
  function moveTo(e) {
    const r=wrap.getBoundingClientRect();
    player.x=Math.max(0,Math.min(W-player.w,e.clientX-r.left-player.w/2));
  }

  document.getElementById('startBtn').addEventListener('click',start);
  document.getElementById('retryBtn').addEventListener('click',start);

  resize();
})();
</script>
